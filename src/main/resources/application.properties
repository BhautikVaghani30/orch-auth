spring.application.name=townUser
spring.profiles.group.default=pooling
spring.profiles.active=default

server.port=8081
#jdbc:mysql://localhost:3307/database
spring.r2dbc.url=r2dbc:mysql://localhost:3300/township_accounts
spring.r2dbc.username=root
spring.r2dbc.password=root


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# --- Database Initialization ---
# This property controls when to run schema.sql and data.sql scripts.
# 'always' is suitable for development to ensure the schema is always up-to-date.
# For production, this should be set to 'never' and schema managed by a dedicated migration tool like Flyway or Liquibase.
spring.sql.init.mode=always

#spring.security.townUser.name=admin
#spring.security.townUser.password=admin123
logging.level.root=INFO
#logging.level.com.core.township=DEBUG
logging.level.com.town.orch.auth=DEBUG

core.audit.error.messages=E_R_1001_Town_User_First_Name_Required,\
  E_R_1002_Town_User_Last_Name_Required,\
  E_R_1003_Town_User_Email_Required,\
  E_R_1004_Town_User_Invalid_Email_Format,\
  E_R_1005_Town_User_Password_Required,\
  E_R_1006_Town_User_Password_Length,\
  E_R_1007_Town_User_Password_Complexity,\
  E_R_1008_Townd_Length,E_R_1007_Town_User_Password_Complexity,\
  E_R_1008_Town_User_Invalid_Phone_Format

# --- Spring WebFlux Session Cookie Configuration ---

# Ensures the cookie is only accessible by the server (prevents XSS).
server.reactive.session.cookie.http-only=true

# Ensures the cookie is only sent over HTTPS.
# Set this to 'true' in production. You can leave it 'false' for local HTTP testing.
server.reactive.session.cookie.secure=false

# Prevents the cookie from being sent with cross-site requests (prevents CSRF).
# 'Strict' is the most secure option.
server.reactive.session.cookie.same-site=Strict

# You can also set a session timeout
spring.session.timeout=30m


